<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Oumei Vocab ✨ 國高中英文單字大冒險</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#ff85a2;--secondary:#90f1ef;--bg:#fff5f8;--text:#4a4a4a}
*{box-sizing:border-box}
body{font-family:'Quicksand','Noto Sans TC',sans-serif;background:linear-gradient(135deg,#fff5f8 0%,#f0f9ff 50%,#fdf4ff 100%);color:var(--text);overflow-x:hidden;min-height:100vh}
.retro-card{background:white;border:3px solid var(--text);box-shadow:6px 6px 0 var(--text);transition:all .15s}
.retro-card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--text)}
.retro-btn{background:var(--primary);border:2.5px solid var(--text);box-shadow:3px 3px 0 var(--text);transition:all .1s;cursor:pointer;font-weight:700}
.retro-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--text)}
.retro-btn:hover{filter:brightness(1.05)}
.correct{background-color:#c6f6d5!important;border-color:#2f855a!important}
.wrong{background-color:#fed7d7!important;border-color:#c53030!important}
.floating{animation:floating 3s ease-in-out infinite}
@keyframes floating{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.sparkle{animation:sparkle 1.5s ease-in-out infinite}
@keyframes sparkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.2)}}
.audio-btn{background:#fdf2f8;border:2px solid var(--text);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:transform .1s;flex-shrink:0}
.audio-btn:active{transform:scale(.9)}
.grade-section{border-radius:20px;overflow:hidden;margin-bottom:1.5rem}
.grade-header{padding:12px 18px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;border-bottom:3px solid rgba(0,0,0,.1)}
.level-chip{border:2.5px solid #333;box-shadow:3px 3px 0 #333;border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:all .15s;background:white;min-width:0}
.level-chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #333}
.pb-outer{width:100%;height:5px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:5px}
.pb-inner{height:100%;border-radius:999px;transition:width .3s}
.option-btn{border:2.5px solid #333;box-shadow:3px 3px 0 #333;border-radius:14px;padding:14px 16px;font-size:1.05rem;font-weight:700;cursor:pointer;background:white;transition:all .1s;text-align:left;width:100%}
.option-btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 #333}
.option-btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 #333}
.option-btn:disabled{cursor:default}
.quiz-word{font-size:clamp(2.2rem,8vw,4rem)}
/* login */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#fff5f8,#f0f9ff,#fdf4ff);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.login-card{background:white;border:4px solid #333;box-shadow:10px 10px 0 #333;border-radius:28px;padding:40px 32px;max-width:380px;width:100%;text-align:center}
.name-input{border:3px solid #333;box-shadow:4px 4px 0 #333;border-radius:14px;padding:14px 18px;font-size:1.2rem;font-family:inherit;font-weight:700;width:100%;outline:none;text-align:center;background:#fff5f8}
.name-input:focus{border-color:var(--primary);box-shadow:4px 4px 0 var(--primary)}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-card">
    <div class="text-6xl mb-4 floating" style="display:inline-block">🐱</div>
    <h1 class="text-3xl font-bold text-pink-500 mb-1">Oumei Vocab</h1>
    <p class="text-gray-400 text-sm mb-8">國高中英文單字大冒險 ✨</p>
    <p class="font-bold text-gray-600 mb-3">請輸入你的名字</p>
    <input id="name-input" class="name-input mb-5" type="text" placeholder="例如：小花、Eric..." maxlength="20" autocomplete="off">
    <button id="start-btn" class="retro-btn w-full py-4 rounded-2xl text-white text-xl" onclick="vm.startWithName()">
      出發冒險 🚀
    </button>
    <p id="login-error" class="text-red-400 text-sm mt-3 hidden">請輸入名字再繼續 😊</p>
  </div>
</div>

<!-- Main App -->
<div id="app" class="min-h-screen p-3 md:p-6 max-w-4xl mx-auto hidden">
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-2xl md:text-3xl font-bold text-pink-500 flex items-center gap-2 cursor-pointer select-none" onclick="vm.showHome()">
      <span class="text-3xl">🐱</span> Oumei Vocab
    </h1>
    <div id="user-info" class="text-xs md:text-sm font-bold bg-white px-3 py-2 border-2 border-black rounded-full shadow-sm cursor-pointer" onclick="vm.confirmLogout()" title="點擊登出">👤 載入中...</div>
  </header>
  <main id="main-content"></main>
</div>

const fbApp = initializeApp(firebaseConfig);
const auth  = getAuth(fbApp);
const db    = getFirestore(fbApp);
const APP_ID = 'oumei001';

let currentUser = null;
let userProgress = {}, srsData = {}, userName = '';

const userDocRef = () => doc(db,'artifacts',APP_ID,'users',currentUser.uid,'settings','main');

const loadUserData = async () => {
  if (!currentUser) return;
  try {
    const d = await getDoc(userDocRef());
    if (d.exists()) {
      userProgress = d.data().progress || {};
      srsData      = d.data().srs      || {};
      if (d.data().name && !userName) userName = d.data().name;
    }
  } catch(e) { console.warn('load failed', e); }
};

const saveUserData = async () => {
  if (!currentUser) return;
  try {
    await setDoc(userDocRef(), {
      name: userName, progress: userProgress, srs: srsData, updatedAt: Date.now()
    }, { merge: true });
  } catch(e) { console.warn('save failed', e); }
};

// ── Auth init ─────────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  currentUser = user;
  if (user) {
    await loadUserData();
    // Check if name already set (returning user)
    const stored = localStorage.getItem('oumei001_name');
    if (stored) {
      userName = stored;
      vm.enterApp();
    }
    // else: wait for user to type name in login screen
  }
});

signInAnonymously(auth);

window.vm = {
  currentIndex:0, score:0, questions:[], currentWord:null, isAnswered:false, currentLevel:null,

  startWithName() {
    const val = document.getElementById('name-input').value.trim();
    if (!val) { document.getElementById('login-error').classList.remove('hidden'); return; }
    userName = val;
    localStorage.setItem('oumei001_name', val);
    saveUserData();
    this.enterApp();
  },

  enterApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('user-info').innerText = '👤 ' + userName;
    this.showHome();
  },

  confirmLogout() {
    if (confirm(`登出「${userName}」？
（進度已儲存，下次可重新登入）`)) {
      localStorage.removeItem('oumei001_name');
      location.reload();
    }
  },

    if (!text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    if (cb) u.onend = cb;
    window.speechSynthesis.speak(u);
  },

  showHome() {
    const main = document.getElementById('main-content');
    const wrongIds = Object.keys(srsData).filter(id => srsData[id].isWrong);
    const mastered = Object.values(userProgress).filter(v => v >= 18).length;

    let gradesHtml = '';
    gradeGroups.forEach(grade => {
      const st = gradeStyle[grade.name] || {emoji:'📚',bg:'#f3f4f6',border:'#9ca3af',bar:'#d1d5db'};
      let lvHtml = '';
      grade.sub_levels.forEach((sl, i) => {
        const prog  = userProgress[sl.levelId] || 0;
        const total = sl.ids.length;
        const pct   = Math.round(prog/total*100);
        const icon  = prog >= total*.9 ? '🏆' : prog >= total*.5 ? '⭐' : '🎒';
        lvHtml += `<div class="level-chip" onclick="vm.startLevel(${sl.levelId})">
          <div class="text-xl">${icon}</div>
          <div class="text-[11px] font-bold mt-0.5 text-center leading-tight">${grade.name.replace('年級','')} #${i+1}</div>
          <div class="text-[10px] text-gray-400">${prog}/${total}</div>
          <div class="pb-outer"><div class="pb-inner" style="width:${pct}%;background:${st.bar}"></div></div>
        </div>`;
      });
      gradesHtml += `<div class="grade-section border-2" style="border-color:${st.border};background:${st.bg}">
        <div class="grade-header" style="background:${st.border}33">
          <span class="text-2xl">${st.emoji}</span><span>${grade.name}</span>
          <span class="text-sm font-normal text-gray-500 ml-auto">${grade.sub_levels.length} 關卡 · ${grade.total} 個單字</span>
        </div>
        <div class="grid grid-cols-3 sm:grid-cols-5 gap-2 p-3">${lvHtml}</div>
      </div>`;
    });

    main.innerHTML = `
      <div class="flex gap-3 mb-5 flex-wrap">
        <div class="retro-card px-4 py-3 rounded-2xl flex items-center gap-2 cursor-default">
          <span class="text-xl">📚</span>
          <div><div class="text-xs text-gray-400">總單字</div><div class="font-bold text-lg">${wordBank.length}</div></div>
        </div>
        <div class="retro-card px-4 py-3 rounded-2xl flex items-center gap-2 cursor-default">
          <span class="text-xl">🏆</span>
          <div><div class="text-xs text-gray-400">已通關</div><div class="font-bold text-lg">${mastered} 關</div></div>
        </div>
        ${wrongIds.length > 0 ? `<div class="retro-card px-4 py-3 rounded-2xl flex items-center gap-2 cursor-pointer" style="border-color:#facc15" onclick="vm.startReview()">
          <span class="text-xl sparkle">🧠</span>
          <div><div class="text-xs text-gray-400">待複習</div><div class="font-bold text-lg text-yellow-600">${wrongIds.length} 字</div></div>
        </div>` : ''}
      </div>
      ${gradesHtml}`;
  },

  getLevelWords(levelId) {
    for (const g of gradeGroups)
      for (const sl of g.sub_levels)
        if (sl.levelId === levelId)
          return sl.ids.map(id => wordById[id]).filter(Boolean);
    return [];
  },

  startLevel(levelId) {
    this.currentLevel = levelId;
    this.questions = this.getLevelWords(levelId);
    this.currentIndex = 0; this.score = 0;
    this.renderQuiz();
  },

  startReview() {
    const wrongIds = Object.keys(srsData).filter(id => srsData[id].isWrong);
    this.questions = wrongIds.map(id => wordById[id]).filter(Boolean);
    if (!this.questions.length) { this.showHome(); return; }
    this.currentLevel = 'review';
    this.currentIndex = 0; this.score = 0;
    this.renderQuiz();
  },

  renderQuiz() {
    this.isAnswered = false;
    const word = this.questions[this.currentIndex];
    this.currentWord = word;
    const main = document.getElementById('main-content');

    let opts = [word.ch];
    const pool = wordBank.filter(w => w.ch !== word.ch);
    for (let t=0; opts.length<4 && t<300; t++) {
      const r = pool[Math.floor(Math.random()*pool.length)].ch;
      if (!opts.includes(r)) opts.push(r);
    }
    opts.sort(() => Math.random()-.5);

    const safeEn = word.en.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const lvLbl  = this.currentLevel==='review' ? '✏️ 複習' : `📖 第 ${this.currentLevel} 關`;
    const pct    = (this.currentIndex/this.questions.length*100).toFixed(0);

    main.innerHTML = `
      <div class="flex justify-between items-center mb-3">
        <button class="font-bold text-gray-400 hover:text-pink-500 text-sm" onclick="vm.showHome()">🏠 回首頁</button>
        <div class="bg-white px-4 py-1 border-2 border-black rounded-full font-bold text-sm">${lvLbl} · ${this.currentIndex+1}/${this.questions.length}</div>
        <div class="text-sm font-bold text-pink-400">⭐ ${this.score}</div>
      </div>
      <div class="w-full bg-gray-100 h-2 rounded-full mb-5 overflow-hidden">
        <div class="bg-pink-300 h-full rounded-full transition-all duration-500" style="width:${pct}%"></div>
      </div>
      <div class="retro-card p-8 rounded-3xl bg-white text-center mb-4">
        <div class="flex justify-center mb-4">
          <button class="w-16 h-16 bg-pink-50 rounded-full text-3xl hover:scale-110 transition" style="border:3px solid black" onclick="vm.speak('${safeEn}')">🔊</button>
        </div>
        <h2 class="quiz-word font-bold text-pink-500 mb-8 tracking-tight">${word.en}</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="options-box">
          ${opts.map(o => `<button class="option-btn" onclick="vm.checkAnswer(this,'${o.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">${o}</button>`).join('')}
        </div>
      </div>
      <div id="feedback" class="hidden"></div>`;

    setTimeout(() => this.speak(word.en), 400);
  },

  checkAnswer(btn, choice) {
    if (this.isAnswered) return;
    this.isAnswered = true;
    const isOK = choice === this.currentWord.ch;
    const feedback = document.getElementById('feedback');
    const optBox   = document.getElementById('options-box');

    Array.from(optBox.children).forEach(b => {
      b.disabled = true;
      if (b.innerText.trim() === this.currentWord.ch) b.classList.add('correct');
    });
    if (isOK) { this.score++; if (srsData[this.currentWord.id]) srsData[this.currentWord.id].isWrong=false; }
    else       { btn.classList.add('wrong'); srsData[this.currentWord.id]={isWrong:true}; }

    const w = this.currentWord;
    const sp = s => s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    feedback.innerHTML = `
      <div class="retro-card p-5 rounded-3xl bg-white space-y-4">
        <div class="flex items-center gap-2">
          <span class="text-3xl">${isOK?'🌟':'💡'}</span>
          <h3 class="text-xl font-bold ${isOK?'text-green-500':'text-red-500'}">${isOK?'太棒了！完全正確 🎉':'正確答案是：'+w.ch}</h3>
        </div>
        <div class="bg-pink-50 p-4 rounded-2xl border-2 border-dashed border-pink-200 space-y-3">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs font-bold text-blue-500 bg-blue-100 px-2 py-0.5 rounded-full">PHRASE 片語</span>
              <button class="audio-btn" onclick="vm.speak('${sp(w.phr_en)}')">🔊</button>
            </div>
            <p class="text-lg font-bold text-gray-700">"${w.phr_en}"</p>
            <p class="text-sm text-gray-400 font-bold">${w.phr_ch}</p>
          </div>
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs font-bold text-pink-500 bg-pink-100 px-2 py-0.5 rounded-full">EXAMPLE 例句</span>
              <button class="audio-btn" onclick="vm.speak('${sp(w.eg_en)}')">🔊</button>
            </div>
            <p class="text-base text-gray-600 font-medium">${w.eg_en}</p>
            <p class="text-sm text-gray-400">${w.eg_ch}</p>
          </div>
        </div>
        <button class="retro-btn w-full py-4 rounded-2xl text-white text-lg" onclick="vm.next()">下一題 ➔</button>
      </div>`;
    feedback.classList.remove('hidden');
    this.speak(w.en, ()=>setTimeout(()=>this.speak(w.phr_en,()=>setTimeout(()=>this.speak(w.eg_en),500)),500));
  },

  next() {
    this.currentIndex++;
    if (this.currentIndex < this.questions.length) this.renderQuiz();
    else this.finish();
  },

  finish() {
    const main = document.getElementById('main-content');
    if (typeof this.currentLevel==='number') {
      const old = userProgress[this.currentLevel]||0;
      if (this.score>old) userProgress[this.currentLevel]=this.score;
    }
    saveUserData();
    const pct=Math.round(this.score/this.questions.length*100);
    const emoji=pct===100?'🎊':pct>=80?'🎉':'💪';
    const msg=pct===100?'完美滿分！🌟':pct>=80?'表現很棒！繼續加油！':'繼續努力，你可以的！';
    main.innerHTML=`
      <div class="retro-card p-10 rounded-3xl text-center bg-white floating">
        <div class="text-6xl mb-4">${emoji}</div>
        <h2 class="text-3xl font-bold text-pink-500 mb-1">測驗完成！</h2>
        <p class="text-gray-400 mb-4">${msg}</p>
        <p class="text-2xl font-bold mb-6 text-gray-500">得分: <span class="text-pink-500 text-5xl">${this.score}</span>/${this.questions.length}</p>
        <div class="flex gap-3 justify-center flex-wrap">
          <button class="retro-btn px-8 py-3 rounded-full text-white font-bold" onclick="vm.startLevel(vm.currentLevel)">再挑戰 🔄</button>
          <button class="retro-btn px-8 py-3 rounded-full text-white font-bold" style="background:#90f1ef" onclick="vm.showHome()">返回大廳 🏠</button>
        </div>
      </div>`;
  }
};

// Enter on name input
document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') vm.startWithName();
});
</script>
</body>
</html>
